    <!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | SEI</title>
    <link rel="stylesheet" href="../css/site.css">
</head>

<body>
    <a class="skip-link" href="#mainContent">Pular para o conteúdo principal</a>
    <header class="site-header auth-header">
        <a class="brand" href="/">
            <span class="brand-dot" aria-hidden="true">
                <img class="brand-logo" src="../src/img/logo-sei-transparente.png" alt="">
            </span>
            <span>SEI • Sistema de Ensino e Investimento</span>
        </a>
        <nav class="site-nav">
            <a href="register.html">Criar conta</a>
        </nav>
    </header>

    <main id="mainContent" class="auth-page">
        <section class="auth-card" aria-label="Formulário de login">
            <p class="eyebrow">Entrar</p>
            <h1>Bem-vindo de volta</h1>
            <p class="auth-subtitle">Acesse seu painel para continuar aprendendo e simulando.</p>

            <form id="loginForm" class="auth-form">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="seuemail@exemplo.com">

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <p id="authMessage" class="auth-message" role="status" aria-live="polite" aria-atomic="true"></p>
            <p class="auth-link">Ainda não tem conta? <a href="register.html">Crie sua conta</a></p>
        </section>
    </main>

    <script src="../js/site-auth.js"></script>
</body>

</html>
